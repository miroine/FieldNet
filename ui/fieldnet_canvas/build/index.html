<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;background:#0e1117;color:#f3f5f7;font:13px system-ui;overflow:hidden}.toolbar{height:48px;display:flex;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid #343a43;background:#141922}.toolbar button,.toolbar select{background:#202733;color:#fff;border:1px solid #46505f;border-radius:6px;padding:6px 9px}.toolbar .sp{flex:1}.wrap{display:flex;height:590px}.palette{width:126px;border-right:1px solid #343a43;padding:8px;background:#11161e}.palette button{width:100%;margin:3px 0;text-align:left}.canvas{position:relative;flex:1;overflow:auto;background-image:radial-gradient(#303844 1px,transparent 1px);background-size:20px 20px}.node{position:absolute;width:154px;min-height:72px;padding:9px 12px;border:1px solid #5b6675;border-radius:9px;background:#1a202a;box-shadow:0 3px 10px #0009;cursor:move;z-index:3}.node.sel{outline:2px solid #67b7ff}.kind{font-size:9px;letter-spacing:.7px;text-transform:uppercase;opacity:.65}.result{margin-top:5px;color:#8dd3ff;font-size:11px}.port{position:absolute;width:12px;height:12px;border-radius:50%;background:#e9edf2;border:2px solid #59697d;top:31px;cursor:crosshair}.pin{left:-7px}.pout{right:-7px}.connecting{background:#ffcc66}.edge{stroke:#8ca9ff;stroke-width:2;fill:none;pointer-events:stroke;cursor:pointer}.edge.sel{stroke:#ffcc66;stroke-width:4}.edgeText{fill:#d8dee9;font-size:10px;pointer-events:none}.status{position:absolute;left:10px;bottom:10px;background:#151b24dd;border:1px solid #394453;border-radius:6px;padding:5px 8px;z-index:5}.hint{opacity:.65;font-size:11px}svg{position:absolute;inset:0;z-index:1;overflow:visible}.danger{border-color:#a44!important}
</style></head><body>
<div class="toolbar"><b>FieldNet v7 Editor</b><button id="del">Delete</button><button id="copy">Copy</button><button id="undo">Undo</button><button id="redo">Redo</button><button id="fit">Auto-layout</button><span class="sp"></span><span class="hint">Drag • select • click OUT then IN to connect</span></div>
<div class="wrap"><div class="palette"><b>Add equipment</b><div id="pal"></div></div><div id="canvas" class="canvas"><svg id="svg"></svg><div id="status" class="status">Ready</div></div></div>
<script>
const TYPES=['well','manifold','separator','sink']; let state={nodes:[],edges:[],p:{},q:{}}, selected=null, connectFrom=null, undo=[], redo=[]; const c=document.getElementById('canvas'),svg=document.getElementById('svg'),status=document.getElementById('status');
function send(){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:{nodes:state.nodes,edges:state.edges,selected}},'*')}
function frame(h=650){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:h},'*')}
function snap(){return JSON.stringify({nodes:state.nodes,edges:state.edges})} function checkpoint(){undo.push(snap());if(undo.length>50)undo.shift();redo=[]}
function restore(s){let x=JSON.parse(s);state.nodes=x.nodes;state.edges=x.edges;selected=null;render();send()}
function uid(){return Math.random().toString(36).slice(2,10)}
function defaults(k){let n={id:uid(),kind:k,name:k.toUpperCase()+'-'+(state.nodes.length+1),pressure_bar:null,x:60+state.nodes.length%4*190,y:60+Math.floor(state.nodes.length/4)*120,params:{}};if(k==='well')n.params={reservoir_pressure_bar:220,ipr_model:'PI',pi_m3d_bar:10,qmax_m3d:1500,initial_pressure_bar:80,initial_rate_m3d:500,depth_m:2000,tubing_id_m:.0889,tubing_roughness_m:4.5e-5,temperature_c:70,water_cut:.2,gor_sm3sm3:100,api:35,gas_sg:.75,correlation:'Beggs-Brill'};if(k==='sink'||k==='separator')n.pressure_bar=35;return n}
function edgeDefault(a,b){return {id:uid(),source:a,target:b,kind:'pipeline',length_m:1000,diameter_m:.154,roughness_m:4.5e-5,elevation_change_m:0,params:{temperature_c:50,water_cut:.2,gor_sm3sm3:100,api:35,gas_sg:.75,initial_rate_m3d:500,correlation:'Beggs-Brill',cv:80,shutoff_head_bar:35,rated_rate_m3d:1500,efficiency:.75,pressure_ratio:1.8,max_discharge_bar:250,max_rate_m3d:3000}}}
TYPES.forEach(k=>{let b=document.createElement('button');b.textContent='+ '+k;b.onclick=()=>{checkpoint();state.nodes.push(defaults(k));render();send()};document.getElementById('pal').appendChild(b)})
function render(){c.querySelectorAll('.node').forEach(x=>x.remove());svg.innerHTML='';let els={};state.nodes.forEach(n=>{let e=document.createElement('div');e.className='node'+(selected===n.id?' sel':'');e.style.left=(+n.x||20)+'px';e.style.top=(+n.y||20)+'px';e.innerHTML=`<div class=kind>${n.kind}</div><b>${n.name}</b><span class="port pin" title="input"></span><span class="port pout ${connectFrom===n.id?'connecting':''}" title="output"></span><div class=result>${state.p[n.id]!=null?Number(state.p[n.id]).toFixed(1)+' bar':'unsolved'}</div>`;e.onclick=ev=>{if(ev.target.classList.contains('port'))return;selected=n.id;render()};let pin=e.querySelector('.pin'),pout=e.querySelector('.pout');pout.onclick=ev=>{ev.stopPropagation();connectFrom=n.id;status.textContent='Connecting from '+n.name+' — click target IN port';render()};pin.onclick=ev=>{ev.stopPropagation();if(connectFrom&&connectFrom!==n.id){checkpoint();state.edges.push(edgeDefault(connectFrom,n.id));connectFrom=null;status.textContent='Connection created';render();send()}};let drag=null;e.onpointerdown=ev=>{if(ev.target.classList.contains('port'))return;e.setPointerCapture(ev.pointerId);drag={x:ev.clientX,y:ev.clientY,l:+n.x||0,t:+n.y||0};checkpoint()};e.onpointermove=ev=>{if(!drag)return;n.x=drag.l+ev.clientX-drag.x;n.y=drag.t+ev.clientY-drag.y;e.style.left=n.x+'px';e.style.top=n.y+'px';draw(els)};e.onpointerup=ev=>{if(!drag)return;drag=null;send()};c.appendChild(e);els[n.id]=e});draw(els)}
function draw(els){svg.innerHTML='';svg.setAttribute('width',Math.max(c.scrollWidth,900));svg.setAttribute('height',Math.max(c.scrollHeight,590));state.edges.forEach(ed=>{let a=els[ed.source],b=els[ed.target];if(!a||!b)return;let x1=a.offsetLeft+a.offsetWidth,y1=a.offsetTop+34,x2=b.offsetLeft,y2=b.offsetTop+34,dx=Math.max(45,Math.abs(x2-x1)/2);let p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',`M${x1},${y1} C${x1+dx},${y1} ${x2-dx},${y2} ${x2},${y2}`);p.setAttribute('class','edge'+(selected===ed.id?' sel':''));p.onclick=()=>{selected=ed.id;render()};svg.appendChild(p);let t=document.createElementNS('http://www.w3.org/2000/svg','text');t.setAttribute('x',(x1+x2)/2);t.setAttribute('y',(y1+y2)/2-5);t.setAttribute('class','edgeText');t.textContent=ed.kind+(state.q[ed.id]!=null?' • '+Number(state.q[ed.id]).toFixed(0)+' m³/d':'');svg.appendChild(t)})}
document.getElementById('del').onclick=()=>{if(!selected)return;checkpoint();if(state.nodes.some(n=>n.id===selected)){state.nodes=state.nodes.filter(n=>n.id!==selected);state.edges=state.edges.filter(e=>e.source!==selected&&e.target!==selected)}else state.edges=state.edges.filter(e=>e.id!==selected);selected=null;render();send()};
document.getElementById('copy').onclick=()=>{let n=state.nodes.find(n=>n.id===selected);if(!n)return;checkpoint();let z=JSON.parse(JSON.stringify(n));z.id=uid();z.name+=' COPY';z.x=(+z.x||0)+35;z.y=(+z.y||0)+35;state.nodes.push(z);selected=z.id;render();send()};
document.getElementById('undo').onclick=()=>{if(!undo.length)return;redo.push(snap());restore(undo.pop())};document.getElementById('redo').onclick=()=>{if(!redo.length)return;undo.push(snap());restore(redo.pop())};
document.getElementById('fit').onclick=()=>{checkpoint();state.nodes.forEach((n,i)=>{n.x=60+(i%4)*200;n.y=60+Math.floor(i/4)*120});render();send()};
window.addEventListener('message',ev=>{let d=ev.data;if(d.type!=='streamlit:render')return;let a=d.args||{};state.nodes=JSON.parse(JSON.stringify(a.nodes||[]));state.edges=JSON.parse(JSON.stringify(a.edges||[]));state.p=a.pressures||{};state.q=a.rates||{};render();frame(a.height||650)});parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');frame();
</script></body></html>
