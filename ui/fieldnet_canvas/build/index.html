<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;background:#0e1117;color:#f3f5f7;font:13px system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;user-select:none}
.toolbar{height:48px;display:flex;gap:6px;align-items:center;padding:7px 10px;border-bottom:1px solid #343a43;background:#141922}
.toolbar button{background:#202733;color:#fff;border:1px solid #46505f;border-radius:6px;padding:5px 9px;cursor:pointer;font:inherit}
.toolbar button:hover{background:#2a3342}.toolbar button:disabled{opacity:.4;cursor:default}
.sep{width:1px;height:24px;background:#394453;margin:0 4px}.sp{flex:1}
#zoomLabel{min-width:46px;text-align:center;font-variant-numeric:tabular-nums;opacity:.85}
.badge{padding:4px 10px;border-radius:12px;font-weight:600;font-size:11px;letter-spacing:.5px;display:inline-flex;align-items:center;gap:6px;border:1px solid transparent}
.badge.UNSOLVED{background:#2a2f38;color:#c9d1dc;border-color:#4a5463}
.badge.SOLVING{background:#3d3212;color:#ffd166;border-color:#8a6d1c}
.badge.SOLVED{background:#123524;color:#6ee7a8;border-color:#1f7a4d}
.badge.FAILED{background:#3d1518;color:#ff8a8a;border-color:#8a2a2f}
.spin{width:10px;height:10px;border:2px solid #ffd16655;border-top-color:#ffd166;border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.wrap{display:flex;height:590px}
.palette{width:132px;border-right:1px solid #343a43;padding:8px;background:#11161e;overflow:auto}
.palette button{width:100%;margin:3px 0;text-align:left;background:#202733;color:#fff;border:1px solid #46505f;border-radius:6px;padding:5px 8px;cursor:pointer;font:inherit}
.palette .hint{margin-top:10px;font-size:11px;opacity:.6;line-height:1.35}
#vp{position:relative;flex:1;overflow:hidden;cursor:grab;background-color:#0e1117}
#vp.panning{cursor:grabbing}#vp.connecting{cursor:crosshair}
#grid{position:absolute;inset:0;pointer-events:none}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
svg#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;z-index:1}
.node{position:absolute;width:154px;min-height:74px;padding:9px 12px 8px 14px;border:1px solid #5b6675;border-radius:9px;background:#1a202a;box-shadow:0 3px 10px #0009;cursor:move;z-index:3}
.node.sel{outline:2px solid #67b7ff}
.node .stripe{position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:9px 0 0 9px}
.kind{font-size:9px;letter-spacing:.7px;text-transform:uppercase;opacity:.65}
.nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.result{margin-top:5px;color:#8dd3ff;font-size:11px;min-height:14px}.result.stale{color:#7b8594}
.port{position:absolute;width:14px;height:14px;border-radius:50%;background:#e9edf2;border:2px solid #59697d;top:30px;z-index:4}
.pin{left:-8px;cursor:default}.pout{right:-8px;cursor:crosshair}
.pout:hover{background:#ffcc66;border-color:#b8860b}
.pin.target{background:#6ee7a8;border-color:#1f7a4d;transform:scale(1.35)}
.pin.bad{background:#ff8a8a;border-color:#8a2a2f;transform:scale(1.2)}
.edge{stroke:#8ca9ff;stroke-width:2;fill:none;pointer-events:stroke;cursor:pointer}
.edge:hover{stroke:#b9c9ff;stroke-width:3}.edge.sel{stroke:#ffcc66;stroke-width:4}
.edge.zero{stroke-dasharray:5 4;opacity:.7}
.hit{stroke:transparent;stroke-width:12;fill:none;pointer-events:stroke;cursor:pointer}
.live{stroke:#ffcc66;stroke-width:2.5;fill:none;stroke-dasharray:6 4;pointer-events:none}
.edgeText{fill:#d8dee9;font-size:10px;font-weight:500;pointer-events:none;paint-order:stroke;stroke:#0e1117;stroke-width:3px}
.status{position:absolute;left:10px;bottom:10px;background:#151b24ee;border:1px solid #394453;border-radius:6px;padding:5px 8px;z-index:5;max-width:70%;pointer-events:none}
.msg{position:absolute;right:10px;bottom:10px;background:#151b24ee;border:1px solid #394453;border-radius:6px;padding:5px 8px;z-index:5;max-width:45%;font-size:11px;pointer-events:none}
</style></head><body>
<div class="toolbar">
  <b>FieldNet Editor</b><span id="badge" class="badge UNSOLVED">UNSOLVED</span>
  <span class="sep"></span>
  <button id="del" title="Delete selection (Del)">Delete</button><button id="copy" title="Duplicate node">Copy</button>
  <button id="undo" title="Undo (Ctrl+Z)">Undo</button><button id="redo" title="Redo (Ctrl+Y)">Redo</button><button id="layout" title="Arrange nodes left-to-right">Auto-layout</button>
  <span class="sp"></span>
  <button id="zout" title="Zoom out">−</button><span id="zoomLabel">100%</span><button id="zin" title="Zoom in">+</button>
  <button id="fit" title="Fit network in view">Fit</button><button id="reset" title="Reset view (100%, origin)">Reset</button>
</div>
<div class="wrap"><div class="palette"><b>Add equipment</b><div id="pal"></div>
<div class="hint">Drag from a component's <b>OUT</b> port (right) and drop on another component's <b>IN</b> port (left) to connect.<br><br>Drag empty space to pan · wheel to zoom.<br>Pan and zoom stay in the editor and never trigger a rerun.</div></div>
<div id="vp"><canvas id="grid"></canvas><div id="world"><svg id="edges"></svg></div><div id="status" class="status">Ready</div><div id="msg" class="msg" style="display:none"></div></div></div>
<script>
const SCHEMA='fieldnet.graph/1';
const TYPES=['well','manifold','separator','sink','water_source','water_injector'];
const COLORS={well:'#29b6f6',manifold:'#9fa8da',separator:'#66bb6a',separator_stage:'#66bb6a',sink:'#ef5350',oil_export:'#ef5350',gas_export:'#ef5350',water_disposal:'#ef5350',water_source:'#4dd0e1',gas_source:'#ffb74d',water_injector:'#4dd0e1',gas_injector:'#ffb74d',reservoir:'#8d6e63'};
const NODE_W=154, PORT_Y=37;
let state={nodes:[],edges:[],p:{},q:{},status:'UNSOLVED',message:''};
let selected=null, undo=[], redo=[], rev=0, pending=null, firstRender=true;
let view={k:1,tx:0,ty:0};
let mode=null; // {type:'drag'|'pan'|'connect', ...}
const vp=document.getElementById('vp'), world=document.getElementById('world'), svg=document.getElementById('edges'), grid=document.getElementById('grid');
const statusEl=document.getElementById('status'), msgEl=document.getElementById('msg'), badge=document.getElementById('badge');
const SVGNS='http://www.w3.org/2000/svg';

/* ---------- Streamlit plumbing: only graph/selection edits are sent ---------- */
function send(){rev+=1;parent.postMessage({isStreamlitMessage:true,type:'streamlit:setComponentValue',value:{schema:SCHEMA,rev:Date.now()+'-'+rev,nodes:state.nodes,edges:state.edges,selected}},'*')}
function frame(h=640){parent.postMessage({isStreamlitMessage:true,type:'streamlit:setFrameHeight',height:h},'*')}
function snap(){return JSON.stringify({nodes:state.nodes,edges:state.edges})}
function checkpoint(){undo.push(snap());if(undo.length>60)undo.shift();redo=[];tools()}
function restore(s){const x=JSON.parse(s);state.nodes=x.nodes;state.edges=x.edges;selected=null;render();send()}
function uid(){return Math.random().toString(36).slice(2,10)}
function say(t){statusEl.textContent=t}

/* ---------- view (pan / zoom) : purely local ---------- */
function applyView(){world.style.transform=`translate(${view.tx}px,${view.ty}px) scale(${view.k})`;document.getElementById('zoomLabel').textContent=Math.round(view.k*100)+'%';drawGrid()}
function drawGrid(){const r=vp.getBoundingClientRect();grid.width=r.width;grid.height=r.height;const g=grid.getContext('2d');g.clearRect(0,0,r.width,r.height);let s=20*view.k;while(s<10)s*=2;g.fillStyle='#303844';const ox=((view.tx%s)+s)%s, oy=((view.ty%s)+s)%s;for(let x=ox;x<r.width;x+=s)for(let y=oy;y<r.height;y+=s)g.fillRect(x,y,1.2,1.2)}
function toWorld(cx,cy){const r=vp.getBoundingClientRect();return {x:(cx-r.left-view.tx)/view.k,y:(cy-r.top-view.ty)/view.k}}
function zoomAt(cx,cy,f){const r=vp.getBoundingClientRect();const px=cx-r.left,py=cy-r.top;const k=Math.min(3,Math.max(0.15,view.k*f));f=k/view.k;view.tx=px-(px-view.tx)*f;view.ty=py-(py-view.ty)*f;view.k=k;applyView()}
function zoomCenter(f){const r=vp.getBoundingClientRect();zoomAt(r.left+r.width/2,r.top+r.height/2,f)}
function fit(){if(!state.nodes.length){view={k:1,tx:0,ty:0};applyView();return}let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;state.nodes.forEach(n=>{const x=+n.x||0,y=+n.y||0;x0=Math.min(x0,x);y0=Math.min(y0,y);x1=Math.max(x1,x+NODE_W);y1=Math.max(y1,y+80)});const r=vp.getBoundingClientRect(),pad=50;const k=Math.min(1.6,Math.max(0.15,Math.min((r.width-2*pad)/Math.max(x1-x0,1),(r.height-2*pad)/Math.max(y1-y0,1))));view.k=k;view.tx=(r.width-(x1-x0)*k)/2-x0*k;view.ty=(r.height-(y1-y0)*k)/2-y0*k;applyView()}
document.getElementById('zin').onclick=()=>zoomCenter(1.2);
document.getElementById('zout').onclick=()=>zoomCenter(1/1.2);
document.getElementById('fit').onclick=fit;
document.getElementById('reset').onclick=()=>{view={k:1,tx:0,ty:0};applyView()};
vp.addEventListener('wheel',ev=>{ev.preventDefault();zoomAt(ev.clientX,ev.clientY,Math.exp(-ev.deltaY*0.0015))},{passive:false});
window.addEventListener('resize',()=>applyView());

/* ---------- graph helpers ---------- */
function defaults(k,x,y){const n={id:uid(),kind:k,name:k.toUpperCase()+'-'+(state.nodes.length+1),pressure_bar:null,x,y,params:{}};
 if(k==='well')n.params={reservoir_pressure_bar:220,ipr_model:'PI',pi_m3d_bar:10,qmax_m3d:1500,initial_rate_m3d:500,depth_m:2000,tubing_id_m:.0889,tubing_roughness_m:4.5e-5,temperature_c:70,water_cut:.2,gor_sm3sm3:100,api:35,gas_sg:.75,vlp_model:'Beggs-Brill',available:true};
 if(k==='sink'||k==='separator')n.pressure_bar=35;if(k==='water_source')n.pressure_bar=180;
 if(k==='water_injector')n.params={injection_fluid:'water',injectivity_m3d_bar:10,reservoir_pressure_bar:200,depth_m:2000,available:true};return n}
function edgeDefault(a,b){return {id:uid(),source:a,target:b,kind:'pipeline',length_m:1000,diameter_m:.154,roughness_m:4.5e-5,elevation_change_m:0,params:{temperature_c:50,water_cut:.2,gor_sm3sm3:100,api:35,gas_sg:.75,initial_rate_m3d:500,correlation:'Beggs-Brill',cv:80,shutoff_head_bar:35,rated_rate_m3d:1500,efficiency:.75,pressure_ratio:1.8,max_discharge_bar:250,opening:1,speed_fraction:1,map_enabled:false,rated_gas_rate_sm3d:150000}}}
function nodeById(id){return state.nodes.find(n=>n.id===id)}
function connectionProblem(a,b){if(!a||!b)return 'Drop on a component';if(a===b)return 'Cannot connect a component to itself';if(state.edges.some(e=>e.source===a&&e.target===b))return 'Already connected';return null}
TYPES.forEach(k=>{const b=document.createElement('button');b.textContent='+ '+k.replace('_',' ');b.onclick=()=>{const r=vp.getBoundingClientRect();const c=toWorld(r.left+r.width/2,r.top+r.height/2);const off=(state.nodes.length%5)*18;checkpoint();const n=defaults(k,Math.round(c.x-NODE_W/2+off),Math.round(c.y-37+off));state.nodes.push(n);selected=n.id;render();send();say('Added '+n.name)};document.getElementById('pal').appendChild(b)});

/* ---------- rendering ---------- */
const els={};
function solvedView(){return state.status==='SOLVED'||state.status==='FAILED'}
function render(){
 world.querySelectorAll('.node').forEach(x=>x.remove());for(const k in els)delete els[k];
 state.nodes.forEach((n,i)=>{if(!isFinite(+n.x)||!isFinite(+n.y)){n.x=60+(i%4)*200;n.y=60+Math.floor(i/4)*120}
  const e=document.createElement('div');e.className='node'+(selected===n.id?' sel':'');e.style.left=(+n.x)+'px';e.style.top=(+n.y)+'px';e.dataset.id=n.id;
  const pv=state.p[n.id];const res=(solvedView()&&pv!=null)?Number(pv).toFixed(1)+' bar':'unsolved';
  e.innerHTML=`<span class="stripe" style="background:${COLORS[n.kind]||'#9aa5b1'}"></span><div class=kind>${n.kind.replace('_',' ')}</div><div class=nm title="${n.name}">${n.name}</div><span class="port pin" data-port="in" title="IN — drop a connection here"></span><span class="port pout" data-port="out" title="OUT — drag to another component's IN port"></span><div class="result ${res==='unsolved'?'stale':''}">${res}</div>`;
  world.appendChild(e);els[n.id]=e});
 draw();tools();
}
function portPos(id,which){const n=nodeById(id),e=els[id];if(!n)return null;const w=e?e.offsetWidth:NODE_W;return {x:(+n.x)+(which==='out'?w:0),y:(+n.y)+PORT_Y}}
function curve(a,b){const dx=Math.max(45,Math.abs(b.x-a.x)/2);return `M${a.x},${a.y} C${a.x+dx},${a.y} ${b.x-dx},${b.y} ${b.x},${b.y}`}
function draw(){
 svg.innerHTML='<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8ca9ff"/></marker></defs>';
 state.edges.forEach(ed=>{const a=portPos(ed.source,'out'),b=portPos(ed.target,'in');if(!a||!b)return;const d=curve(a,b);
  const hit=document.createElementNS(SVGNS,'path');hit.setAttribute('d',d);hit.setAttribute('class','hit');hit.dataset.edge=ed.id;svg.appendChild(hit);
  const q=state.q[ed.id];const p=document.createElementNS(SVGNS,'path');p.setAttribute('d',d);p.setAttribute('class','edge'+(selected===ed.id?' sel':'')+(solvedView()&&q!=null&&Math.abs(q)<1e-6?' zero':''));p.setAttribute('marker-end','url(#arr)');p.dataset.edge=ed.id;svg.appendChild(p);
  const mpt=p.getTotalLength?p.getPointAtLength(p.getTotalLength()/2):{x:(a.x+b.x)/2,y:(a.y+b.y)/2};const t=document.createElementNS(SVGNS,'text');t.setAttribute('x',mpt.x);t.setAttribute('y',mpt.y-7);t.setAttribute('text-anchor','middle');t.setAttribute('class','edgeText');t.textContent=ed.kind+((solvedView()&&q!=null)?' • '+Number(q).toFixed(0)+' m³/d':'');svg.appendChild(t)});
 if(mode&&mode.type==='connect'&&mode.cur){const a=portPos(mode.from,'out');const l=document.createElementNS(SVGNS,'path');l.setAttribute('d',curve(a,mode.cur));l.setAttribute('class','live');svg.appendChild(l)}
}
function tools(){document.getElementById('undo').disabled=!undo.length;document.getElementById('redo').disabled=!redo.length;document.getElementById('del').disabled=!selected;document.getElementById('copy').disabled=!nodeById(selected)}
function setStatus(s,m){state.status=s||'UNSOLVED';state.message=m||'';badge.className='badge '+state.status;badge.innerHTML=(state.status==='SOLVING'?'<span class="spin"></span>':'')+state.status;badge.title=state.message;if(state.message&&state.status!=='SOLVED'){msgEl.style.display='block';msgEl.textContent=state.message}else if(state.status==='SOLVED'&&state.message){msgEl.style.display='block';msgEl.textContent=state.message}else msgEl.style.display='none'}

/* ---------- pointer interactions ---------- */
function clearTargets(){world.querySelectorAll('.pin.target,.pin.bad').forEach(x=>x.classList.remove('target','bad'))}
function nodeUnder(cx,cy){const el=document.elementFromPoint(cx,cy);const nd=el&&el.closest&&el.closest('.node');return nd?nd.dataset.id:null}
vp.addEventListener('pointerdown',ev=>{
 if(ev.button!==0)return;const t=ev.target;const nodeEl=t.closest&&t.closest('.node');
 if(t.dataset&&t.dataset.port==='out'&&nodeEl){ // start a connection drag
  mode={type:'connect',from:nodeEl.dataset.id,cur:toWorld(ev.clientX,ev.clientY),target:null};vp.classList.add('connecting');vp.setPointerCapture(ev.pointerId);say('Drop on the target IN port');draw();ev.preventDefault();return}
 if(t.dataset&&t.dataset.edge){selected=t.dataset.edge;render();send();return}
 if(nodeEl&&!(t.dataset&&t.dataset.port)){const n=nodeById(nodeEl.dataset.id);mode={type:'drag',id:n.id,sx:ev.clientX,sy:ev.clientY,ox:+n.x,oy:+n.y,moved:false,snap:snap()};vp.setPointerCapture(ev.pointerId);return}
 if(!nodeEl){mode={type:'pan',sx:ev.clientX,sy:ev.clientY,tx:view.tx,ty:view.ty,moved:false};vp.classList.add('panning');vp.setPointerCapture(ev.pointerId)}
});
vp.addEventListener('pointermove',ev=>{
 if(!mode)return;
 if(mode.type==='pan'){const dx=ev.clientX-mode.sx,dy=ev.clientY-mode.sy;if(Math.abs(dx)+Math.abs(dy)>2)mode.moved=true;view.tx=mode.tx+dx;view.ty=mode.ty+dy;applyView();return}
 if(mode.type==='drag'){const dx=(ev.clientX-mode.sx)/view.k,dy=(ev.clientY-mode.sy)/view.k;if(!mode.moved&&Math.abs(dx)+Math.abs(dy)<3/view.k)return;if(!mode.moved){mode.moved=true;undo.push(mode.snap);if(undo.length>60)undo.shift();redo=[]}
  const n=nodeById(mode.id);n.x=Math.round(mode.ox+dx);n.y=Math.round(mode.oy+dy);els[n.id].style.left=n.x+'px';els[n.id].style.top=n.y+'px';draw();return}
 if(mode.type==='connect'){mode.cur=toWorld(ev.clientX,ev.clientY);clearTargets();const tid=nodeUnder(ev.clientX,ev.clientY);mode.target=tid;
  if(tid&&tid!==mode.from){const prob=connectionProblem(mode.from,tid);const pin=els[tid]&&els[tid].querySelector('.pin');if(pin){pin.classList.add(prob?'bad':'target');const p=portPos(tid,'in');if(!prob)mode.cur=p}say(prob||('Release to connect to '+nodeById(tid).name))}else say('Drop on the target IN port');draw()}
});
function endPointer(ev){
 if(!mode)return;const m=mode;mode=null;vp.classList.remove('panning','connecting');clearTargets();
 if(m.type==='pan'){if(!m.moved&&selected){selected=null;render();send()}}
 else if(m.type==='drag'){if(m.moved){send();say('Moved')}else{selected=m.id;render();send()}}
 else if(m.type==='connect'){const tid=nodeUnder(ev.clientX,ev.clientY)||m.target;const prob=connectionProblem(m.from,tid);
  if(!prob){checkpoint();const e=edgeDefault(m.from,tid);state.edges.push(e);selected=e.id;render();send();say('Connected '+nodeById(m.from).name+' → '+nodeById(tid).name)}else{draw();say(tid&&tid!==m.from?prob:'Connection cancelled')}}
 if(pending){const a=pending;pending=null;applyArgs(a)}
}
vp.addEventListener('pointerup',endPointer);vp.addEventListener('pointercancel',endPointer);

/* ---------- toolbar edits (these change the graph and are sent) ---------- */
function deleteSelection(){if(!selected)return;checkpoint();if(nodeById(selected)){state.nodes=state.nodes.filter(n=>n.id!==selected);state.edges=state.edges.filter(e=>e.source!==selected&&e.target!==selected)}else state.edges=state.edges.filter(e=>e.id!==selected);selected=null;render();send();say('Deleted')}
document.getElementById('del').onclick=deleteSelection;
document.getElementById('copy').onclick=()=>{const n=nodeById(selected);if(!n)return;checkpoint();const z=JSON.parse(JSON.stringify(n));z.id=uid();z.name+=' COPY';z.x=(+z.x||0)+35;z.y=(+z.y||0)+35;state.nodes.push(z);selected=z.id;render();send()};
document.getElementById('undo').onclick=()=>{if(!undo.length)return;redo.push(snap());restore(undo.pop())};
document.getElementById('redo').onclick=()=>{if(!redo.length)return;undo.push(snap());restore(redo.pop())};
document.getElementById('layout').onclick=()=>{checkpoint();const indeg={},adj={};state.nodes.forEach(n=>{indeg[n.id]=0;adj[n.id]=[]});state.edges.forEach(e=>{if(e.target in indeg&&e.source in adj){indeg[e.target]++;adj[e.source].push(e.target)}});const lvl={};const q=state.nodes.filter(n=>!indeg[n.id]).map(n=>n.id);q.forEach(i=>lvl[i]=0);while(q.length){const u=q.shift();adj[u].forEach(v=>{lvl[v]=Math.max(lvl[v]||0,lvl[u]+1);if(--indeg[v]===0)q.push(v)})}const cnt={};state.nodes.forEach(n=>{const l=lvl[n.id]||0;cnt[l]=(cnt[l]||0);n.x=40+l*240;n.y=40+cnt[l]*120;cnt[l]++});render();fit();send()};
window.addEventListener('keydown',ev=>{if((ev.key==='Delete'||ev.key==='Backspace')&&selected){ev.preventDefault();deleteSelection()}else if(ev.key==='Escape'&&mode&&mode.type==='connect'){mode=null;vp.classList.remove('connecting');clearTargets();draw();say('Connection cancelled')}else if((ev.ctrlKey||ev.metaKey)&&ev.key==='z'){document.getElementById('undo').click()}else if((ev.ctrlKey||ev.metaKey)&&ev.key==='y'){document.getElementById('redo').click()}});

/* ---------- args from Python (graph + solve state) ---------- */
function applyArgs(a){state.nodes=JSON.parse(JSON.stringify(a.nodes||[]));state.edges=JSON.parse(JSON.stringify(a.edges||[]));state.p=a.pressures||{};state.q=a.rates||{};
 if(a.selected!==undefined&&a.selected!==null)selected=a.selected;if(selected&&!nodeById(selected)&&!state.edges.some(e=>e.id===selected))selected=null;
 setStatus(a.status,a.status_message);render();if(firstRender){firstRender=false;fit()}}
window.addEventListener('message',ev=>{const d=ev.data;if(!d||d.type!=='streamlit:render')return;const a=d.args||{};frame(a.height||640);
 if(mode){pending=a;return} // never yank the graph away mid-gesture
 applyArgs(a)});
parent.postMessage({isStreamlitMessage:true,type:'streamlit:componentReady',apiVersion:1},'*');frame();applyView();
</script></body></html>
