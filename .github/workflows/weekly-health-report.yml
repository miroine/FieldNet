name: Weekly App Health Report

on:
  push:
    paths:
      - .github/workflows/weekly-health-report.yml
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  weekly-health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies and run full test suite
        id: health
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pytest -q --junitxml=weekly-pytest-results.xml

      - name: Upload test results
        if: always() && hashFiles('weekly-pytest-results.xml') != ''
        uses: actions/upload-artifact@v4
        with:
          name: weekly-pytest-results
          path: weekly-pytest-results.xml
          if-no-files-found: ignore
          retention-days: 30

      - name: Create or update weekly GitHub issue
        id: report
        if: always()
        uses: actions/github-script@v7
        env:
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- fieldnet-weekly-health-report -->';
            const issueTitle = 'Weekly FieldNet Health Report';
            const outcome = process.env.HEALTH_OUTCOME || 'failure';
            const passed = outcome === 'success';
            const reportDate = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

            let counts = null;
            let failedTests = [];
            const junitPath = 'weekly-pytest-results.xml';
            if (fs.existsSync(junitPath)) {
              const xml = fs.readFileSync(junitPath, 'utf8');
              const cases = [...xml.matchAll(/<testcase\b([^>]*?)(?:\/>|>([\s\S]*?)<\/testcase>)/g)];
              const attr = (attributes, key) =>
                (attributes.match(new RegExp(`\\b${key}="([^"]*)"`)) || [])[1] || '';
              counts = { total: cases.length, failures: 0, errors: 0, skipped: 0 };
              for (const [, attributes, body] of cases) {
                const content = body || '';
                if (/<failure\b/.test(content)) {
                  counts.failures++;
                  failedTests.push(`${attr(attributes, 'classname')}.${attr(attributes, 'name')}`);
                } else if (/<error\b/.test(content)) {
                  counts.errors++;
                  failedTests.push(`${attr(attributes, 'classname')}.${attr(attributes, 'name')}`);
                } else if (/<skipped\b/.test(content)) {
                  counts.skipped++;
                }
              }
            }

            const resultLine = passed
              ? `**Result: PASS** — the full pytest suite completed successfully.`
              : `**Result: FAILURE** — dependency installation or the full pytest suite failed. See the [workflow run](${runUrl}) for logs.`;
            const testLine = counts
              ? `Collected **${counts.total}** tests: ${counts.total - counts.failures - counts.errors - counts.skipped} passed, ${counts.failures} failed, ${counts.errors} errors, ${counts.skipped} skipped.`
              : 'Pytest did not produce a JUnit report; dependency installation may have failed before tests started.';
            const failures = failedTests.length
              ? `\n\nFailing test cases (names only):\n${failedTests.slice(0, 40).map(name => `- \`${name}\``).join('\n')}${failedTests.length > 40 ? `\n- …and ${failedTests.length - 40} more; see the workflow run.` : ''}`
              : '';
            const actionRequest = passed
              ? ''
              : `\n\n@copilot Please investigate these failures, reproduce them, add or update regression tests, and submit a minimal fix as a pull request. Do not commit directly to \`main\`.`;
            const suggestions = passed
              ? '- Consider running the optional Playwright canvas checks as a separate browser-test job; they are not part of default pytest discovery.\n- Add coverage for newly changed workflows and engineering edge cases.'
              : '- Prioritize reproducing the listed failures and preserving each fix with a focused regression test.\n- Review the optional Playwright canvas checks separately if the changes touch the editor.';
            const comment = [
              `## Weekly health check — ${reportDate}`,
              '',
              resultLine,
              '',
              testLine,
              failures,
              '',
              '### Suggested follow-ups',
              suggestions,
              '',
              `Full logs and artifacts: [GitHub Actions run](${runUrl}).`,
              actionRequest,
            ].filter(Boolean).join('\n');

            const { owner, repo } = context.repo;
            const existingIssues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'all', per_page: 100,
            });
            let issue = existingIssues.find(item =>
              !item.pull_request && item.title === issueTitle && item.body?.includes(marker)
            );

            if (!issue) {
              const created = await github.rest.issues.create({
                owner, repo, title: issueTitle,
                body: `${marker}\nThis issue holds the recurring automated weekly test report. Each run appends its results below.`,
              });
              issue = created.data;
            } else if (!passed && issue.state === 'closed') {
              const reopened = await github.rest.issues.update({
                owner, repo, issue_number: issue.number, state: 'open',
              });
              issue = reopened.data;
            }

            await github.rest.issues.createComment({
              owner, repo, issue_number: issue.number, body: comment,
            });
            core.setOutput('issue_number', String(issue.number));
            core.notice(`Weekly health report added to issue #${issue.number}.`);

      - name: Assign failing report to Copilot
        if: steps.health.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ steps.report.outputs.issue_number }}
        run: gh issue edit "$ISSUE_NUMBER" --add-assignee "@copilot"
